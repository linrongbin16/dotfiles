name: CI
permissions:
  contents: write
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 3
  CARGO_TERM_COLOR: always
jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The install path in the README, isolated from the full installations
      # below: a machine with no `git` and no checkout, downloading the
      # repository with `curl` alone. Fast enough to be worth running on its
      # own, and it fails loudly if the tarball URL, the unpack, or the
      # re-exec breaks.
      - name: Download without git
        env:
          DOTFILES_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          DOTFILES_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # `git` is what this step must not need, and the runner has it, so
          # shadow it with a stub that fails: anything reaching for `git` here
          # would report success on a fresh machine only by accident.
          mkdir -p "$RUNNER_TEMP/no-git"
          printf '#!/bin/sh\necho "bootstrap must not need git" >&2\nexit 127\n' \
            >"$RUNNER_TEMP/no-git/git"
          chmod +x "$RUNNER_TEMP/no-git/git"

          curl -fsSL "https://raw.githubusercontent.com/${DOTFILES_REPO}/${DOTFILES_BRANCH}/bootstrap" |
            env PATH="$RUNNER_TEMP/no-git:$PATH" \
              DOTFILES_REPO="$DOTFILES_REPO" \
              DOTFILES_BRANCH="$DOTFILES_BRANCH" \
              DOTFILES_DOWNLOAD_ONLY=1 \
              bash

          test -f "$HOME/.dotfiles/inst/util.sh"
          test -f "$HOME/.dotfiles/install"
          echo "downloaded $(find "$HOME/.dotfiles" -type f | wc -l) files"
  ubuntu:
    name: Ubuntu
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        shell: [bash, zsh]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install zsh
        if: matrix.shell == 'zsh'
        run: |
          sudo apt-get install -y zsh ||
            { sudo apt-get update && sudo apt-get install -y zsh; }
      - name: Install dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTFILES_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          DOTFILES_BRANCH: ${{ github.head_ref || github.ref_name }}
          SHELL: /usr/bin/${{ matrix.shell }}
        run: |
          # The documented install command, run as documented: no `git`, no
          # pre-existing clone. `pipefail` keeps a failed `curl` from looking
          # like a successful install of an empty script.
          set -o pipefail
          curl -fsSL "https://raw.githubusercontent.com/${DOTFILES_REPO}/${DOTFILES_BRANCH}/bootstrap" |
            $SHELL
          $SHELL ~/.dotfiles/dotfiles.sh
  macos:
    name: MacOS
    strategy:
      matrix:
        shell: [bash, zsh]
    runs-on: macos-latest
    steps:
      - name: Install dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOTFILES_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          DOTFILES_BRANCH: ${{ github.head_ref || github.ref_name }}
          SHELL: /bin/${{ matrix.shell }}
        run: |
          set -o pipefail
          curl -fsSL "https://raw.githubusercontent.com/${DOTFILES_REPO}/${DOTFILES_BRANCH}/bootstrap" |
            $SHELL
          $SHELL ~/.dotfiles/dotfiles.sh
  windows:
    name: Windows (${{ matrix.os }}, ${{ matrix.shell }})
    # Both hosts run the same entry point: `install.ps1` only bootstraps PowerShell 7 and hands over
    # to `inst/install.ps1`, so the `powershell.exe` leg is what proves that 5.1 can still start the
    # installation (and that the installer itself refuses to run under it).
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
        shell: [pwsh.exe, powershell.exe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: MinoruSekine/setup-scoop@v5.0.1
      - name: Get branch
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        shell: bash
        id: extract_branch
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --single-branch --branch ${{ steps.extract_branch.outputs.branch }} --depth=1 https://github.com/linrongbin16/dotfiles $env:USERPROFILE\.dotfiles
          cd $env:USERPROFILE\.dotfiles
          & '${{ matrix.shell }}' -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\install.ps1
      - name: Evaluate dotfiles.ps1
        run: |
          cd $env:USERPROFILE\.dotfiles
          & '${{ matrix.shell }}' -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\dotfiles.ps1
