name: CI
permissions:
  contents: write
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 3
  CARGO_TERM_COLOR: always
jobs:
  ubuntu:
    name: Ubuntu
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        shell: [bash, zsh]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install zsh
        if: matrix.shell == 'zsh'
        run: |
          # The runner image ships package lists, and `./install` refreshes
          # them again a moment later. Try those cached lists first and only
          # pay for an update when they are too old to resolve zsh.
          sudo apt-get install -y zsh ||
            { sudo apt-get update && sudo apt-get install -y zsh; }
      - name: Install dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          SHELL: /usr/bin/${{ matrix.shell }}
        run: |
          git clone --single-branch --branch "$BRANCH_NAME" --depth=1 https://github.com/linrongbin16/dotfiles ~/.dotfiles
          cd ~/.dotfiles
          $SHELL ./install
          $SHELL ~/.dotfiles/dotfiles.sh
  macos:
    name: MacOS
    strategy:
      matrix:
        shell: [bash, zsh]
    runs-on: macos-latest
    steps:
      # The runner image already provides Xcode's toolchain and Homebrew;
      # `install` runs `brew update` itself, so neither needs a setup action.
      - name: Install dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          SHELL: /bin/${{ matrix.shell }}
        run: |
          git clone --single-branch --branch "$BRANCH_NAME" --depth=1 https://github.com/linrongbin16/dotfiles ~/.dotfiles
          cd ~/.dotfiles
          $SHELL ./install
          $SHELL ~/.dotfiles/dotfiles.sh
  windows:
    name: Windows
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: MinoruSekine/setup-scoop@v5.0.1
        with:
          buckets: extras
      - name: Get branch
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        shell: bash
        id: extract_branch
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '${{ steps.extract_branch.outputs.branch }}'
          echo ${{ steps.extract_branch.outputs.branch }}
          git clone --single-branch --branch ${{ steps.extract_branch.outputs.branch }} --depth=1 https://github.com/linrongbin16/dotfiles $env:USERPROFILE\.dotfiles
          cd $env:USERPROFILE\.dotfiles
          pwsh .\install.ps1
